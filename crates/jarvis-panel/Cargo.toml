[package]
name = "jarvis-panel"
version = "0.1.0"
edition = "2024"

[features]
metal = ["jarvis-voice/metal"]

[dependencies]
jarvis-voice = { path = "../jarvis-voice" }
jarvis = { path = "../.." }
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros", "net", "process", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSRunningApplication", "NSApplication", "NSButton", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSPanel", "NSResponder", "NSScreen", "NSScrollView", "NSClipView", "NSTextView", "NSTextContainer", "NSText", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSObject", "NSString", "NSRunLoop"] }
