[package]
name = "jarvis-voice"
version = "0.1.0"
edition = "2024"

[features]
default = []
whisper = ["dep:whisper-rs"]
metal = ["whisper", "whisper-rs/metal"]

[dependencies]
serde_json = "1"
crossbeam-queue = "0.3.14"
hound = "3.5"
rustix = { version = "1.1.5", features = ["fs"] }
whisper-rs = { version = "0.16", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
sherpa-onnx = "=1.13.8"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"] }

# Reuse the ONNX Runtime already linked by sherpa-onnx; loading a second
# runtime caused native teardown aborts despite correct inference scores.
ort-sys = { version = "=2.0.0-rc.10", default-features = false, features = ["disable-linking"] }

[[bin]]
name = "jarvis-voice"
path = "src/main.rs"
required-features = ["whisper"]
