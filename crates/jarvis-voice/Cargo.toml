[package]
name = "jarvis-voice"
version = "0.1.0"
edition = "2024"

[features]
default = []
metal = ["whisper-rs/metal"]

[dependencies]
crossbeam-queue = "0.3.14"
hound = "3.5"
rustix = { version = "1.1.5", features = ["fs"] }
whisper-rs = { version = "0.16", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
sherpa-onnx = "=1.13.8"
